async function saveTips(){

async function saveResult(){

const data = {

r1: document.getElementById("n1").value,
r2: document.getElementById("n2").value,
r3: document.getElementById("n3").value,
r4: document.getElementById("n4").value,
r5: document.getElementById("n5").value,

s8: document.getElementById("s8").value

};

let today = new Date();

let result_date = today.toLocaleDateString('en-GB');

let month = today.toLocaleString('default',{month:'long'});

let year = today.getFullYear();

const { error } = await client
.from("result")
.update({
result_date,
month,
year,

r1:data.r1,
r2:data.r2,
r3:data.r3,
r4:data.r4,
r5:data.r5,
r6:data.r6,
r7:data.r7,
r8:data.r8,

s1:data.s1,
s2:data.s2,
s3:data.s3,
s4:data.s4,
s5:data.s5,
s6:data.s6,
s7:data.s7,
s8:data.s8
})
.eq("id",1);

if(error){
alert("Result Error");
console.log(error);
}else{
alert("Result Saved Successfully");

}

async function newDayStart(){

let pass = prompt("Enter Master Password");

if(pass !== "BMVIVEK888"){
alert("Wrong Password");
return;
}

let ok = confirm(
"Are you sure? Current Today Result Previous Result me move ho jayega."
);

if(!ok){
return;
}

// Latest Today Result lao
let { data, error } = await client
.from("result")
.select("*")
.order("id",{ascending:false})
.limit(1);

if(error || !data.length){
alert("No Result Found");
return;
}

let row = data[0];
delete row.id;
// Previous Result me add karo
let { error: prevError } = await client
.from("previous_result")
.insert([row]);

if(prevError){
console.log(prevError);
alert(JSON.stringify(prevError));
return;
}

// Previous Result count check karo
let { data: prevRows } = await client
.from("previous_result")
.select("*")
.order("id",{ascending:false});

if(prevRows.length > 10){

   let extraRows = prevRows.slice(10);

   for(const row of extraRows){

      if(!row.result_date) continue;

      let deleteId = row.id;

      delete row.id;

      await client
      .from("old_result")
      .insert([row]);

      await client
      .from("previous_result")
      .delete()
      .eq("id", deleteId);
   }
}

}
