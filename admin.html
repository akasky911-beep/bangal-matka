<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Result Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#10131a;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:600px;
  margin:auto;
}

h1,h2{
  text-align:center;
}

.card{
  background:#1b202b;
  padding:20px;
  margin:18px 0;
  border-radius:14px;
}

input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:0;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:8px;
  background:#1687ff;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

.newday{
  background:#e67e22;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Daily Result Admin</h1>

<div class="card">

<h2>Daily Information</h2>

<input
  type="date"
  id="dateBox"
>

<input
  type="text"
  id="b1"
  placeholder="Value 1"
>

<input
  type="text"
  id="b2"
  placeholder="Value 2"
>

<input
  type="text"
  id="b3"
  placeholder="Value 3"
>

<input
  type="text"
  id="b4"
  placeholder="Value 4"
>

<input
  type="text"
  id="b5"
  placeholder="Value 5"
>

<input
  type="text"
  id="b6"
  placeholder="Value 6"
>

<input
  type="text"
  id="b7"
  placeholder="Value 7"
>

<input
  type="text"
  id="b8"
  placeholder="Value 8"
>

<button onclick="saveData()">
SAVE DATA
</button>

<div class="message" id="message"></div>

</div>


<div class="card">

<h2>Second Row</h2>

<input id="s1" placeholder="Second Row 1">
<input id="s2" placeholder="Second Row 2">
<input id="s3" placeholder="Second Row 3">
<input id="s4" placeholder="Second Row 4">
<input id="s5" placeholder="Second Row 5">
<input id="s6" placeholder="Second Row 6">
<input id="s7" placeholder="Second Row 7">
<input id="s8" placeholder="Second Row 8">

<button onclick="saveData()">
SAVE SECOND ROW
</button>

</div>


<div class="card">

<h2>New Day</h2>

<button class="newday" onclick="newDay()">
NEW DAY START
</button>

</div>

</div>


<script>

function getData(){

  return {
    date: document.getElementById("dateBox").value,

    b1: document.getElementById("b1").value,
    b2: document.getElementById("b2").value,
    b3: document.getElementById("b3").value,
    b4: document.getElementById("b4").value,
    b5: document.getElementById("b5").value,
    b6: document.getElementById("b6").value,
    b7: document.getElementById("b7").value,
    b8: document.getElementById("b8").value,

    s1: document.getElementById("s1").value,
    s2: document.getElementById("s2").value,
    s3: document.getElementById("s3").value,
    s4: document.getElementById("s4").value,
    s5: document.getElementById("s5").value,
    s6: document.getElementById("s6").value,
    s7: document.getElementById("s7").value,
    s8: document.getElementById("s8").value
  };

}


function saveData(){

  const data = getData();

  localStorage.setItem(
    "dailyResultData",
    JSON.stringify(data)
  );

  document.getElementById("message").innerText =
    "Data saved successfully.";
}


function loadData(){

  const saved =
    localStorage.getItem("dailyResultData");

  if(!saved) return;

  const data = JSON.parse(saved);

  Object.keys(data).forEach(function(key){

    const element =
      document.getElementById(key);

    if(element){
      element.value = data[key];
    }

  });

}


function newDay(){

  const ok = confirm(
    "Start a new day? Current data will be cleared."
  );

  if(!ok) return;

  document
    .querySelectorAll("input")
    .forEach(function(input){
      input.value = "";
    });

  localStorage.removeItem("dailyResultData");

  document.getElementById("message").innerText =
    "New day started.";
}


loadData();

</script>

</body>
</html>
